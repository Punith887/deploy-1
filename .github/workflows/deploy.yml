
name: Build Docker and Deploy Website

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the latest source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker image and load it locally
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: deploy-1:latest

      # 4. Verify that the image exists
      - name: Verify Docker image
        run: docker image inspect deploy-1:latest

      # 5. Show the image details
      - name: List Docker images
        run: docker images

      # 6. Deploy the static website to Cloudflare Pages
      - name: Deploy website to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=deploy-1 --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
